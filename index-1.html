<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>FitnessPlanner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --c-cardio:#2E8B57; --c-cardio-bg:#E3F3EA; --c-cardio-fg:#1E5E3B;
  --c-kraft:#185FA5;  --c-kraft-bg:#E6F1FB;  --c-kraft-fg:#0C447C;
  --c-dehnen:#E0A82E; --c-dehnen-bg:#FBF2DC; --c-dehnen-fg:#7A5A0B;
  --c-free:#8A9099;   --c-free-bg:#EEF1F4;   --c-free-fg:#565C64;
  --blue:#185FA5; --blue-soft:#E6F1FB;
  --bg:#F4F8FC; --card:#FFFFFF;
  --ink:#16232F; --ink-2:#5C6A78; --ink-3:#94A2B0;
  --line:#E4EBF2; --radius:14px;
  --priv:#7B3F52; --priv-bg:#FAF2F4; --priv-line:#EEDCE2;
  --danger:#B03A3A; --danger-bg:#FDF0F0; --danger-line:#F0D5D5;
}
svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
html,body{margin:0;padding:0;background:#DDE6EF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.phone{width:100%;max-width:412px;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(20,40,60,.18);transition:background .2s}
.phone.priv{--bg:var(--priv-bg);--line:var(--priv-line);--blue-soft:#F3E3E8}
@media(min-width:520px){.phone{height:880px;margin:auto;border-radius:26px}}

.hdr{padding:16px 18px 8px;background:var(--bg);flex:0 0 auto;z-index:5;transition:background .2s}
.hdr h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.hdr .sub{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lastlink{font-size:11.5px;font-style:italic;color:var(--ink-2);text-align:right;line-height:1.4;background:none;border:0;padding:6px 0 6px 8px;cursor:pointer;font-family:inherit;max-width:52%}
.lastlink b{display:block;font-style:normal;font-weight:650;color:var(--blue);text-decoration:underline;text-underline-offset:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone.priv .lastlink b{color:var(--priv)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;padding:0;flex:0 0 auto}
.screen{flex:1 1 auto;overflow-y:auto;padding:0 18px 26px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.tabs{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;padding:8px 1px 6px;font:inherit;font-size:10.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--blue);font-weight:600}
.phone.priv .tab.on{color:var(--priv)}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:14px}
.ex{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);padding:10px 12px;margin-bottom:9px;border:1.5px solid var(--line);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.ex.picked{background:var(--blue-soft)}
.badge{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:0 0 auto}
.thumb{position:relative;width:44px;height:44px;flex:0 0 auto}
.thumb img{width:44px;height:44px;border-radius:11px;object-fit:cover;display:block;background:var(--bg)}
.thumb .tc{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:6px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.ex-main{flex:1;min-width:0}
.ex-top{display:flex;align-items:baseline;gap:7px}
.ex-name{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;flex:0 0 auto}
.ex-val{font-size:13px;color:var(--ink-2);margin-top:2px}
.ex-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.t-cardio{border-color:var(--c-cardio)} .t-cardio .badge{background:var(--c-cardio-bg);color:var(--c-cardio-fg)}
.t-kraft{border-color:var(--c-kraft)}   .t-kraft .badge{background:var(--c-kraft-bg);color:var(--c-kraft-fg)}
.t-dehnen{border-color:var(--c-dehnen)} .t-dehnen .badge{background:var(--c-dehnen-bg);color:var(--c-dehnen-fg)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px}
.chiprow.flat{padding-left:0;padding-right:0;margin:0 0 4px}
.chiprow::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:34px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 40px 11px 14px;font:inherit;font-size:16px;outline:none;color:var(--ink)}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;font-size:19px;color:var(--ink-3);cursor:pointer;line-height:1}
.mini{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin:20px 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini:first-child{margin-top:4px}
.mini .r{text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.p-cardio{background:var(--c-cardio-bg);color:var(--c-cardio-fg)}
.p-kraft{background:var(--c-kraft-bg);color:var(--c-kraft-fg)}
.p-dehnen{background:var(--c-dehnen-bg);color:var(--c-dehnen-fg)}
.focus{display:inline-flex;font-size:11px;font-weight:650;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2)}
.calbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.calbadge.pv{background:#F3E3E8;color:var(--priv)}
.calbadge svg{width:12px;height:12px;stroke-width:2.2}
.plan{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.plan h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.plan .pills{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.star{border:0;background:none;padding:8px;margin:-8px -8px -8px 0;cursor:pointer;color:var(--ink-3);line-height:0}
.star.on{color:#E0A82E}
.star svg{width:20px;height:20px;stroke-width:1.6}
.star.on svg{fill:#E0A82E}
.calhead{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
.calhead button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:9px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.calhead button.on{background:var(--blue);color:#fff}
.phone.priv .calhead button.on{background:var(--priv)}
.calhead svg{width:14px;height:14px;stroke-width:2}
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav .kw{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.weeknav .kw b{font-size:14px;font-weight:650}
.weeknav .kw span{font-size:12px;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}
.weeknav .nv{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;font-size:16px;color:var(--ink-2);cursor:pointer;line-height:1;flex:0 0 auto}
.day{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.day.today{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.phone.priv .day.today{border-color:var(--priv)}
.daybox{width:42px;flex:0 0 auto;text-align:center}
.daybox .dn{font-size:10.5px;color:var(--ink-3);font-weight:650}
.daybox .dd{font-size:18px;font-weight:650;margin-top:1px}
.daymain{flex:1;min-width:0}
.daymain .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daymain .s{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--ink-3);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.freebox{background:var(--c-free-bg);color:var(--c-free-fg);border:1.5px dashed var(--c-free)}
.hero{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;text-align:center}
.hero .badge{width:66px;height:66px;border-radius:17px;font-size:28px;margin:0 auto 12px}
.hero img{width:150px;height:150px;border-radius:16px;object-fit:cover;display:block;margin:0 auto 12px;background:var(--bg)}
.hero h2{margin:0;font-size:21px;font-weight:680;letter-spacing:-.02em}
.hero .code{display:block;margin-top:5px;font-size:12px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.kv .v{font-weight:600;text-align:right;flex:0 0 auto}
.kvlink{width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.kvlink .k{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.setrow{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow .n{color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.notes{font-size:14px;line-height:1.6;white-space:pre-wrap}
.back{border:0;background:none;font:inherit;font-size:14px;color:var(--blue);font-weight:600;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:5px}
.back svg{width:16px;height:16px;stroke-width:2.2}
.btn{width:100%;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:650;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.gray{background:#fff;color:var(--ink-2);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger-line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:9px;margin-bottom:16px}
.actions .btn{margin-top:0}
.scrim{position:absolute;inset:0;background:rgba(16,32,48,.42);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:86%;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:680;letter-spacing:-.02em}
.sh-sub{font-size:13px;color:var(--ink-2);margin:0 0 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
label.f{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin:14px 0 6px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);outline:none}
textarea.i{min-height:120px;resize:vertical;line-height:1.55}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.num{display:flex;gap:8px}
.num>div{flex:1}
.num small{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:9px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.acc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.acc>summary{padding:12px;font-size:14.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc>summary::-webkit-details-marker{display:none}
.mgi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;background:#fff;width:100%;text-align:left;font-family:inherit;color:inherit;border-left:0;border-right:0;border-bottom:0}
.mgi .cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.box{width:20px;height:20px;border-radius:5px;border:1.6px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.box.on{background:var(--blue);border-color:var(--blue)}
.locked{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink-2)}
.photobox{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.photobox img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--bg)}
.photobox .ph{width:64px;height:64px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex:0 0 auto}
.drow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:9px 10px;margin-bottom:9px;touch-action:pan-y}
.drow.dragging{box-shadow:0 10px 22px rgba(16,40,70,.22);z-index:3;position:relative}
.drow.shift{transition:transform .15s}
.handle{color:var(--ink-3);padding:9px 4px;cursor:grab;touch-action:none;flex:0 0 auto;background:none;border:0}
.handle svg{width:17px;height:17px;stroke-width:2}
.del{border:0;background:var(--danger-bg);color:var(--danger);width:34px;height:34px;border-radius:9px;font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
.stat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:0}
.bar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.stat .n{width:30px;text-align:right;font-weight:650;font-size:13px}
.stat .l{width:122px;flex:0 0 auto;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:14px}
.rowlink{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;color:inherit;text-align:left}
.rowlink .c{font-size:12.5px;color:var(--ink-3);font-weight:400}
.wk{display:flex;align-items:center;gap:12px;padding:12px 13px;background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.wk.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.wk b{font-size:14px;font-weight:650;width:58px;flex:0 0 auto}
.wk.now b{font-weight:800;color:var(--blue)}
.wk .rg{font-size:13px;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace;flex:1}
.wk .cnt{font-size:11.5px;color:var(--ink-3)}

/* Login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
.login .logo{width:64px;height:64px;border-radius:17px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.login .logo svg{width:34px;height:34px;stroke-width:1.8}
.login h1{text-align:center;font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.login p{text-align:center;font-size:13.5px;color:var(--ink-2);margin:0 0 22px}
.err{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin-top:14px}

/* Banner */
.banner{flex:0 0 auto;background:#FDF3E3;border-bottom:1px solid #F2DFBE;color:#7A5A0B;font-size:12.5px;padding:9px 16px;display:flex;align-items:center;gap:9px;line-height:1.4}
.banner svg{width:16px;height:16px;stroke-width:2}
.banner button{margin-left:auto;border:1px solid #E2C98F;background:#fff;color:#7A5A0B;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;flex:0 0 auto}
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-3);font-size:13.5px}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="banner"></div>
  <div id="root"><div class="boot"><div class="spin"></div><div>Lade…</div></div></div>
</div>
<div id="overlay"></div>

<script type="module">

/* ============================================================

const TYPE   = { cardio:{L:'C',label:'Cardio'}, kraft:{L:'K',label:'Kraft'}, dehnen:{L:'D',label:'Dehnen'} };

/* ============================================================
   Hilfsfunktionen
   ============================================================ */
const p2=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fmt=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`;
const fmtLong=d=>`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=k=>new Date(k+'T00:00:00');
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function isoWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-((x.getDay()+6)%7));
  const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
const TODAY=new Date(), MON=mondayOf(TODAY);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const byId=id=>S.EX.find(e=>e.id===id);
const planById=id=>S.PLANS.find(p=>p.id===id);
const uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);

function valLine(e){
  if(e.type==='cardio') return e.sets.level?`${e.sets.minutes} min · Level ${e.sets.level}`:`${e.sets.minutes} min`;
  if(e.type==='dehnen') return `${e.sets.sets} × ${e.sets.sec} s${e.sets.side?' je Seite':''}`;
  if(!Array.isArray(e.sets)||!e.sets.length) return '—';
  const w=[...new Set(e.sets.map(x=>x.w))], r=[...new Set(e.sets.map(x=>x.r))];
  return `${e.sets.length} × ${r.length===1?r[0]:r.join('/')} · ${w.length===1?w[0]+' kg':w.join(' / ')+' kg'}`;
}
const metaLine=e=>[e.mg.join(', '), e.eq].filter(Boolean).join(' · ')||'—';
const allTags=()=>{const m={};S.EX.forEach(e=>e.tags.forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>CMP.compare(a[0],b[0]))};
const eqUsed=()=>{const m={};S.EX.forEach(e=>{if(e.eq)m[e.eq]=(m[e.eq]||0)+1});return GERAET.filter(g=>m[g]).map(g=>[g,m[g]])};
const mgUsed=()=>{const m={};S.EX.forEach(e=>e.mg.forEach(x=>m[x]=(m[x]||0)+1));return MG.filter(x=>m[x]).map(x=>[x,m[x]])};
const anyFilter=()=>S.fmg.length||S.feq.length||S.ftag.length;
const photoUrl=p=>p?sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl:null;

/* ============================================================
   Lesecache (IndexedDB)
   ============================================================ */
function idb(){return new Promise((res,rej)=>{
  const r=indexedDB.open('fitnessplanner',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
})}
async function cacheGet(k){try{const db=await idb();return await new Promise(res=>{
  const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null)})}
  catch(e){return null}}
async function cacheSet(k,v){try{const db=await idb();const tx=db.transaction('kv','readwrite');
  tx.objectStore('kv').put(v,k);}catch(e){}}
async function cacheClear(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').clear()}catch(e){}}

/* ============================================================
   Fehlerübersetzung
   ============================================================ */
function friendly(e){
  const m=(e&&(e.message||e.error_description||e))+'';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Server nicht erreichbar. Entweder keine Verbindung, oder das Supabase-Projekt ist pausiert — im Dashboard aufwecken.';
  if(/Invalid login credentials/i.test(m))      return 'E-Mail oder Passwort stimmt nicht.';
  if(/Email not confirmed/i.test(m))            return 'Konto ist noch nicht bestätigt. Unter Authentication → Users bestätigen.';
  if(/JWT expired|refresh_token/i.test(m))      return 'Sitzung abgelaufen. Bitte neu anmelden.';
  if(/duplicate key.*exercises_code_key/i.test(m)) return 'Dieser Übungscode existiert bereits. Bitte erneut speichern.';
  if(/duplicate key.*workouts_code_key/i.test(m))  return 'Dieser Plancode existiert bereits. Bitte erneut speichern.';
  if(/calendar_shared_uniq|calendar_private_uniq/i.test(m))
    return 'An diesem Tag gibt es in diesem Kalender bereits einen Eintrag.';
  if(/calendar_one_source/i.test(m))            return 'Ein Kalendereintrag braucht entweder einen Plan oder eine Übungsliste.';
  if(/Typ ist nach der Anlage gesperrt/i.test(m))  return 'Der Typ einer Übung lässt sich nicht ändern. Bitte neu anlegen.';
  if(/row-level security|permission denied/i.test(m))
    return 'Keine Berechtigung. Bist du noch angemeldet?';
  return m;
}

/* ============================================================
   Laden
   ============================================================ */
function mapEx(r){return {id:r.id,code:r.code,type:r.type,name:r.name,
  mg:Array.isArray(r.muscle_groups)?r.muscle_groups:[],eq:r.equipment||'',
  sets:r.sets,tags:Array.isArray(r.tags)?r.tags:[],photo_path:r.photo_path||null,
  notes:r.notes||'',archived:!!r.archived}}
function mapPlan(r){return {id:r.id,code:r.code,name:r.name,focus:r.focus||'sonstige',
  fav:!!r.favorite,notes:r.notes||'',items:Array.isArray(r.items)?r.items:[]}}

async function loadAll({silent}={}){
  if(!silent) setBusy(true);
  try{
    const [ex,wo,ca]=await Promise.all([
      sb.from('exercises').select('*').eq('archived',false),
      sb.from('workouts').select('*'),
      sb.from('calendar').select('*')
    ]);
    for(const r of [ex,wo,ca]) if(r.error) throw r.error;

    S.EX=ex.data.map(mapEx);
    S.PLANS=wo.data.map(mapPlan);
    S.CAL={shared:{},private:{}};
    ca.data.forEach(r=>{
      const bucket=r.owner==null?'shared':'private';
      S.CAL[bucket][r.date]={id:r.id, plan:r.workout_id||null,
        free:Array.isArray(r.items)?r.items:null, title:r.title||''};
    });
    S.online=true; S.fromCache=false; S.loadErr=null;
    cacheSet('snapshot',{at:Date.now(),EX:S.EX,PLANS:S.PLANS,CAL:S.CAL});
  }catch(e){
    S.online=false; S.loadErr=friendly(e);
    const snap=await cacheGet('snapshot');
    if(snap){S.EX=snap.EX;S.PLANS=snap.PLANS;S.CAL=snap.CAL;S.fromCache=true;S.cacheAt=snap.at}
  }finally{ setBusy(false); }
}

function setBusy(b){S.busy=b;const el=document.getElementById('busy');if(el)el.style.display=b?'block':'none'}

/* Schreibzugriff: erst Server, dann lokaler Zustand. Kein Auseinanderlaufen. */
async function write(fn, okMsg){
  if(!S.online){ toast('Nur Ansicht — Server nicht erreichbar'); return false; }
  setBusy(true);
  try{
    const { error } = await fn();
    if(error) throw error;
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    toast(friendly(e));
    return false;
  }finally{ setBusy(false); }
}

/* ============================================================
   Codes
   ============================================================ */
async function nextExCode(type){
  const pre=TYPE[type].L;
  try{
    const {data}=await sb.from('exercises').select('code').eq('type',type).order('code',{ascending:false}).limit(1);
    const max=data&&data.length?+data[0].code.slice(1):0;
    return pre+String(max+1).padStart(4,'0');
  }catch(e){
    const max=S.EX.filter(e2=>e2.type===type).map(e2=>+e2.code.slice(1)).reduce((a,b)=>Math.max(a,b),0);
    return pre+String(max+1).padStart(4,'0');
  }
}
async function nextPlanCode(){
  try{
    const {data}=await sb.from('workouts').select('code').order('code',{ascending:false}).limit(1);
    const max=data&&data.length?+data[0].code.slice(1):0;
    return 'P'+String(max+1).padStart(4,'0');
  }catch(e){
    const max=S.PLANS.map(p=>+p.code.slice(1)).reduce((a,b)=>Math.max(a,b),0);
    return 'P'+String(max+1).padStart(4,'0');
  }
}

/* ============================================================
   Bausteine
   ============================================================ */
function thumb(e){
  const u=photoUrl(e.photo_path);
  return u
    ? `<span class="thumb"><img src="${u}" alt="" loading="lazy"><span class="tc" style="background:var(--c-${e.type}-bg);color:var(--c-${e.type}-fg)">${TYPE[e.type].L}</span></span>`
    : `<span class="badge">${TYPE[e.type].L}</span>`;
}
function exCard(e,o={}){
  if(!e) return '';
  const tg=e.tags.slice(0,2).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')+(e.tags.length>2?`<span class="tag">+${e.tags.length-2}</span>`:'');
  return `<button class="ex t-${e.type}" onclick="A.go('exercise','${e.id}')">
    ${thumb(e)}
    <span class="ex-main">
      <span class="ex-top"><span class="ex-name">${esc(e.name)}</span><span class="code">${e.code}</span></span>
      <span class="ex-val" style="display:block">${valLine(e)}</span>
      <span class="ex-meta" style="display:block">${esc(metaLine(e))}</span>
      ${o.tags&&e.tags.length?`<span class="tags">${tg}</span>`:''}
    </span></button>`;
}
function mix(items){
  const c={cardio:0,kraft:0,dehnen:0};
  items.forEach(i=>{const e=byId(i);if(e)c[e.type]++});
  return TORDER.filter(k=>c[k]).map(k=>`<span class="pill p-${k}">${c[k]}× ${TYPE[k].label}</span>`).join('');
}
const calBadge=c=>c==='private'
  ? `<span class="calbadge pv">${s('lock')} Privat</span>`
  : `<span class="calbadge">${s('users')} Gemeinsam</span>`;
function planCard(p){
  return `<div class="plan" role="button" tabindex="0" onclick="A.go('plan','${p.id}')" onkeydown="if(event.key==='Enter')A.go('plan','${p.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <h3>${esc(p.name)}</h3>
      <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto"><span class="code">${p.code}</span>
        <button class="star ${p.fav?'on':''}" aria-label="Favorit" onclick="event.stopPropagation();A.togFav('${p.id}')">${s('star')}</button></div></div>
    <div class="pills"><span class="focus">${FOCUS[p.focus]}</span>${mix(p.items)}</div></div>`;
}
function lastPlan(){
  for(let i=1;i<=120;i++){
    const k=key(addD(TODAY,-i));
    const en=S.CAL.shared[k]||S.CAL.private[k];
    if(en&&en.plan&&planById(en.plan)) return {p:planById(en.plan),d:parse(k)};
  }
  return null;
}

function renderUeb(){
  document.getElementById('hdr').innerHTML=`<h1>Übungen</h1><p class="sub">${S.EX.length} im Pool</p>`;
  const q=S.q.trim().toLowerCase();
  const pass=e=>(S.filter==='alle'||e.type===S.filter)
    && (!q||(e.name+' '+e.code+' '+e.tags.join(' ')+' '+e.mg.join(' ')+' '+e.eq+' '+e.notes).toLowerCase().includes(q))
    && (!S.fmg.length||e.mg.some(m=>S.fmg.includes(m)))
    && (!S.feq.length||S.feq.includes(e.eq))
    && (!S.ftag.length||e.tags.some(t=>S.ftag.includes(t)));
  const hit=S.EX.filter(pass);
  let body='';
  TORDER.forEach(t=>{
    const g=hit.filter(e=>e.type===t).sort((a,b)=>CMP.compare(a.name,b.name));
    if(!g.length)return;
    body+=`<div class="mini">${TYPE[t].label}<span class="r">${g.length}</span></div>`+g.map(e=>exCard(e,{tags:true})).join('');
  });
  const fl=(id,lbl,arr)=>`<button class="chip ${arr.length?'on':''}" onclick="A.sheet('filter','${id}')">${lbl}${arr.length?' · '+arr.length:''} ▾</button>`;

function wireDrag(p){
  const list=document.getElementById('dl'); if(!list)return;
  list.querySelectorAll('[data-drag]').forEach(h=>{
    h.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      const row=h.closest('.drow'), rows=[...list.children];
      const from=rows.indexOf(row), h0=row.offsetHeight+9, y0=ev.clientY;
      let to=from;
      row.classList.add('dragging'); h.setPointerCapture(ev.pointerId);
      const move=e=>{
        const dy=e.clientY-y0; row.style.transform=`translateY(${dy}px)`;
        const t=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h0)));
        if(t!==to){to=t;rows.forEach((r,i)=>{ if(r===row)return; r.classList.add('shift');
          let sh=0; if(from<to&&i>from&&i<=to)sh=-h0; if(from>to&&i<from&&i>=to)sh=h0;
          r.style.transform=`translateY(${sh}px)`});}
      };
      const up=async()=>{
        h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
        if(from===to){render();return}
        const items=[...p.items]; const it=items.splice(from,1)[0]; items.splice(to,0,it);
        const ok=await write(()=>sb.from('workouts').update({items}).eq('id',p.id),'Reihenfolge geändert');
        if(ok)p.items=items;
        render();
      };
      h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
    });
  });
}

/* ============================================================
   CSV
   ============================================================ */
function csvSplit(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else { if(c==='"')q=true; else if(c===';'){out.push(cur);cur=''} else cur+=c }
  }
  out.push(cur);return out.map(x=>x.trim());
}
const multi=v=>v?v.split('|').map(x=>x.trim()).filter(Boolean):[];
const numList=v=>multi(v).map(x=>parseFloat(String(x).replace(',','.'))).filter(n=>!isNaN(n));

function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {rows:[],errs:['Datei ist leer.']};
  const head=csvSplit(lines[0]).map(h=>h.toLowerCase());
  const need=['typ','name'];
  const miss=need.filter(n=>!head.includes(n));
  if(miss.length) return {rows:[],errs:[`Kopfzeile unvollständig, es fehlt: ${miss.join(', ')}`]};
  const col=n=>head.indexOf(n);
  const rows=[],errs=[];
  for(let i=1;i<lines.length;i++){
    const c=csvSplit(lines[i]);
    const g=n=>{const x=col(n);return x<0?'':(c[x]||'')};
    const type=g('typ').toLowerCase();
    const name=g('name');
    if(!name){errs.push(`Zeile ${i+1}: Name fehlt`);continue}
    if(!TYPE[type]){errs.push(`Zeile ${i+1}: Typ "${g('typ')}" unbekannt (cardio/kraft/dehnen)`);continue}
    let sets;
    if(type==='kraft'){
      const n=parseInt(g('saetze'))||3;
      const rs=numList(g('wiederholungen')), ws=numList(g('gewicht_kg'));
      if(rs.length>1&&ws.length>1&&rs.length!==ws.length){errs.push(`Zeile ${i+1}: Wiederholungen und Gewicht haben unterschiedlich viele Werte`);continue}
      const len=Math.max(n,rs.length,ws.length)||1;
      sets=Array.from({length:len},(_,j)=>({r:rs.length?(rs[j]??rs[rs.length-1]):10, w:ws.length?(ws[j]??ws[ws.length-1]):0}));
    } else if(type==='cardio'){
      sets={minutes:parseInt(g('dauer_min'))||10, level:g('level')?parseInt(g('level')):null};
    } else {
      sets={sets:parseInt(g('saetze'))||3, sec:parseInt(g('haltezeit_s'))||30, side:/^(ja|j|yes|true|1|x)$/i.test(g('je_seite'))};
    }
    const eqRaw=g('geraet');
    const eq=GERAET.find(x=>x.toLowerCase()===eqRaw.toLowerCase())||'';
    if(eqRaw&&!eq)errs.push(`Zeile ${i+1}: Gerät "${eqRaw}" nicht in der Liste — wird leer importiert`);
    const mgIn=multi(g('muskelgruppen'));
    const mg=mgIn.map(m=>MG.find(x=>x.toLowerCase()===m.toLowerCase())).filter(Boolean);
    mgIn.filter(m=>!MG.some(x=>x.toLowerCase()===m.toLowerCase()))
        .forEach(m=>errs.push(`Zeile ${i+1}: Muskelgruppe "${m}" unbekannt — übersprungen`));
    rows.push({type,name,eq,mg:mg.sort((a,b)=>MG.indexOf(a)-MG.indexOf(b)),sets,
      tags:multi(g('tags')).map(t=>t.replace(/^#/,'').toLowerCase()),notes:g('notizen')});
  }
  return {rows,errs};
}

function download(name,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},400);
}

  clearFilters(){S.fmg=[];S.feq=[];S.ftag=[];render()},
  toggleF(kind,v){
    const m={mg:'fmg',eq:'feq',tag:'ftag'}[kind], arr=S[m], i=arr.indexOf(v);
    const on=i<0; on?arr.push(v):arr.splice(i,1);
    const row=document.querySelector(`[data-f="${kind}:${CSS.escape(v)}"]`);
    if(row){const bx=row.querySelector('.box');bx.className='box'+(on?' on':'');bx.textContent=on?'✓':''}
    const c=document.getElementById('fcount'); if(c)c.textContent=`Mehrfachauswahl · ${arr.length} aktiv`;
    render();
  },
  resetF(kind){const m={mg:'fmg',eq:'feq',tag:'ftag'}[kind];S[m]=[];
    document.querySelectorAll(`[data-f^="${kind}:"] .box`).forEach(b=>{b.className='box';b.textContent=''});
    const c=document.getElementById('fcount'); if(c)c.textContent='Mehrfachauswahl · 0 aktiv';
    render()},

  /* --- Kalender --- */
  setCal(c){S.cal=c;render()},
  week(d){S.weekOff+=d;render()},
  gotoWeek(o){S.weekOff=o;closeSheet();render()},
  async setPlan(arg,pid){
    const [k,c]=String(arg).split('|'); const cal=c||S.cal;
    const existing=S.CAL[cal][k];
    const ok=await write(()=> existing
      ? sb.from('calendar').update({workout_id:pid,items:null,title:null}).eq('id',existing.id)
      : sb.from('calendar').insert({date:k,owner:cal==='private'?S.user.id:null,workout_id:pid}), 'Plan eingetragen');
    if(ok){await loadAll({silent:true});closeSheet();render()}
  },
  async delDay(k,c){
    const cal=c||S.cal, en=S.CAL[cal][k]; if(!en)return;
    const ok=await write(()=>sb.from('calendar').delete().eq('id',en.id),'Eintrag entfernt');
    if(ok){delete S.CAL[cal][k];closeSheet();render()}
  },
  async setFree(k,c){
    const cal=c||S.cal;
    const ok=await write(()=>sb.from('calendar').insert({date:k,owner:cal==='private'?S.user.id:null,items:[],title:'Freies Training'}));
    if(ok){await loadAll({silent:true});closeSheet();A.sheet('freepick',k+'|'+cal)}
  },
  async toggleFree(arg,eid){
    const [k,c]=String(arg).split('|'), en=S.CAL[c][k]; if(!en||!en.free)return;
    const i=en.free.indexOf(eid), on=i<0;
    const items=on?[...en.free,eid]:en.free.filter(x=>x!==eid);
    const ok=await write(()=>sb.from('calendar').update({items}).eq('id',en.id));
    if(!ok)return;
    en.free=items;
    const row=document.querySelector(`[data-fp="${eid}"]`);
    if(row){row.classList.toggle('picked',on);
      const bx=row.querySelector('.box');if(bx){bx.className='box'+(on?' on':'');bx.textContent=on?'✓':''}}
    const c2=document.getElementById('fpcount'); if(c2)c2.textContent=items.length+' gewählt';
    render();
  },
  async endFree(arg){
    const [k,c]=String(arg).split('|'), en=S.CAL[c][k];
    if(en&&en.free&&!en.free.length){
      const ok=await write(()=>sb.from('calendar').delete().eq('id',en.id));
      if(ok){delete S.CAL[c][k];closeSheet();render();return toast('Ohne Übungen — nicht angelegt')}
    }
    closeSheet();render();toast('Freies Training gespeichert');
  },

  /* --- Pläne --- */
  async togFav(id){
    const p=planById(id);
    const ok=await write(()=>sb.from('workouts').update({favorite:!p.fav}).eq('id',id));
    if(ok){p.fav=!p.fav;render();toast(p.fav?'Angepinnt':'Pin entfernt')}
  },
  async createPlan(){
    const nm=document.getElementById('pn').value.trim();
    if(!nm)return toast('Name darf nicht leer sein');
    const fo=document.getElementById('pf').value;
    const code=await nextPlanCode(), id=uid('wo');
    const ok=await write(()=>sb.from('workouts').insert({id,code,name:nm,focus:fo,items:[]}),`${code} angelegt`);
    if(ok){S.PLANS.push({id,code,name:nm,focus:fo,fav:false,notes:'',items:[]});
      closeSheet();S.edit=true;A.go('plan',id)}
  },
  async savePlanMeta(id){
    const p=planById(id);
    const nm=document.getElementById('pn').value.trim();
    if(!nm)return toast('Name darf nicht leer sein');
    const fo=document.getElementById('pf').value;
    const ok=await write(()=>sb.from('workouts').update({name:nm,focus:fo}).eq('id',id),'Gespeichert');
    if(ok){p.name=nm;p.focus=fo;closeSheet();render()}
  },
  async delPlan(id){
    const p=planById(id);
    if(!confirm(`Plan „${p.name}" wirklich löschen?\n\nKalendereinträge mit diesem Plan werden mit entfernt. Die Übungen bleiben erhalten.`))return;
    const ok=await write(()=>sb.from('workouts').delete().eq('id',id),'Plan gelöscht');
    if(ok){S.PLANS=S.PLANS.filter(x=>x.id!==id);await loadAll({silent:true});S.edit=false;A.back()}
  },
  async addItem(pid,eid){
    const p=planById(pid), items=[...p.items,eid];
    const ok=await write(()=>sb.from('workouts').update({items}).eq('id',pid),'Hinzugefügt');
    if(ok){p.items=items;closeSheet();render()}
  },
  async rmItem(pid,i){
    const p=planById(pid), items=p.items.filter((_,j)=>j!==i);
    const ok=await write(()=>sb.from('workouts').update({items}).eq('id',pid),'Aus Plan entfernt');
    if(ok){p.items=items;render()}
  },

  /* --- Übungsformular --- */
  openForm(id){
    const e=byId(id);
    S.form=JSON.parse(JSON.stringify({isNew:false,id:e.id,type:e.type,code:e.code,name:e.name,eq:e.eq||GERAET[0],
      mg:e.mg,tags:e.tags,notes:e.notes||'',photo_path:e.photo_path,photoData:null,photoBlob:null,sets:e.sets,
      mode:(e.type==='kraft'&&Array.isArray(e.sets)&&new Set(e.sets.map(x=>x.w+'/'+x.r)).size>1)?'per':'std'}));
    A.go('exform',id);
  },
  async newEx(t){
    const code=await nextExCode(t);
    const sets = t==='kraft' ? [{r:10,w:20},{r:10,w:20},{r:10,w:20}]
               : t==='cardio' ? {minutes:10,level:null} : {sets:3,sec:30,side:false};
    S.form={isNew:true,id:null,type:t,code,name:'',eq:t==='cardio'?'Cardiogerät':(t==='dehnen'?'Matte':'Langhantel'),
      mg:[],tags:[],notes:'',photo_path:null,photoData:null,photoBlob:null,sets,mode:'std'};
    closeSheet();A.go('exform','new');
  },
  setF(path,v){const p=path.split('.');let o=S.form;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v},
  togSide(){S.form.sets.side=!S.form.sets.side;renderForm()},
  togMg(m){const f=S.form,i=f.mg.indexOf(m);i<0?f.mg.push(m):f.mg.splice(i,1);
    f.mg.sort((a,b)=>MG.indexOf(a)-MG.indexOf(b));renderForm()},
  setMode(m){S.form.mode=m;renderForm()},
  stdSets(n,r,w){const f=S.form,c=f.sets[0];
    const N=n?Math.max(1,+n):f.sets.length, R=r?+r:c.r, W=(w!==null&&w!==undefined&&w!=='')?+w:c.w;
    f.sets=Array.from({length:N},()=>({r:R,w:W})); if(n)renderForm()},
  perSet(i,k,v){S.form.sets[i][k]=+v},
  addSet(){const f=S.form;f.sets.push({...f.sets[f.sets.length-1]});renderForm()},
  rmSet(i){const f=S.form;if(f.sets.length<2)return toast('Mindestens ein Satz nötig');f.sets.splice(i,1);renderForm()},
  addTag(t){if(!S.form.tags.includes(t))S.form.tags.push(t);renderForm()},
  addNewTag(){const el=document.getElementById('nt');const v=(el.value||'').trim().toLowerCase().replace(/^#/,'');
    if(!v)return;if(!S.form.tags.includes(v))S.form.tags.push(v);el.value='';renderForm()},
  rmTag(t){S.form.tags=S.form.tags.filter(x=>x!==t);renderForm()},
  pickPhoto(inp){
    const file=inp.files&&inp.files[0]; if(!file)return;
    if(!/^image\//.test(file.type))return toast('Bitte eine Bilddatei wählen');
    const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const max=480,sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        cv.toBlob(b=>{S.form.photoBlob=b;S.form.photoData=cv.toDataURL('image/jpeg',0.6);renderForm();
          toast(`Foto verkleinert · ${Math.round(b.size/1024)} KB`)},'image/jpeg',0.6);
      };
      im.onerror=()=>toast('Bild konnte nicht gelesen werden');
      im.src=r.result};
    r.onerror=()=>toast('Datei konnte nicht gelesen werden');
    r.readAsDataURL(file);
  },
  dropPhoto(){S.form.photoBlob=null;S.form.photoData=null;S.form.photo_path=null;renderForm();toast('Foto entfernt')},

  async saveForm(){
    const f=S.form;
    if(!f.name.trim())return toast('Name darf nicht leer sein');
    if(!S.online)return toast('Nur Ansicht — Server nicht erreichbar');
    setBusy(true);
    try{
      const id = f.isNew ? uid('ex') : f.id;

      let photo_path = f.photo_path;
      if(f.photoBlob){
        const path=`${id}.jpg`;
        const {error:uerr}=await sb.storage.from(BUCKET).upload(path,f.photoBlob,{upsert:true,contentType:'image/jpeg'});
        if(uerr)throw uerr;
        photo_path=path;
      }

      const payload={name:f.name.trim(),equipment:f.eq,muscle_groups:f.mg,sets:f.sets,
        tags:f.tags,notes:f.notes||'',photo_path};

      if(f.isNew){
        const code=await nextExCode(f.type);
        const {error}=await sb.from('exercises').insert({id,code,type:f.type,...payload});
        if(error)throw error;
        S.form=null;
        await loadAll({silent:true});
        S.view='exercise';S.arg=id;render();
        return toast(`${code} angelegt`);
      }

      const {error}=await sb.from('exercises').update(payload).eq('id',f.id);
      if(error)throw error;
      S.form=null;
      await loadAll({silent:true});
      A.back();
      toast('Gespeichert');
    }catch(e){
      toast(friendly(e));
    }finally{ setBusy(false); }
  },
  async archive(id){
    const e=byId(id);
    const used=S.PLANS.filter(p=>p.items.includes(id));
    const msg=`„${e.name}" archivieren?`+(used.length?`\n\nWird in ${used.length} Plan/Plänen verwendet und verschwindet dort aus der Anzeige.`:'')+`\n\nDie Übung wird nicht gelöscht, nur ausgeblendet.`;
    if(!confirm(msg))return;
    const ok=await write(()=>sb.from('exercises').update({archived:true}).eq('id',id),'Archiviert');
    if(ok){await loadAll({silent:true});A.back()}
  },

  /* --- Tags --- */
  async doRen(t){
    const v=document.getElementById('rt').value.trim().toLowerCase().replace(/^#/,'');
    if(!v||v===t)return closeSheet();
    const merged=allTags().some(([x])=>x===v);
    const hits=S.EX.filter(e=>e.tags.includes(t));
    if(!S.online)return toast('Nur Ansicht — Server nicht erreichbar');
    setBusy(true);
    try{
      for(const e of hits){
        const tags=[...new Set(e.tags.map(x=>x===t?v:x))];
        const {error}=await sb.from('exercises').update({tags}).eq('id',e.id);
        if(error)throw error; e.tags=tags;
      }
      S.ftag=S.ftag.map(x=>x===t?v:x);
      closeSheet();render();toast(merged?`Zusammengeführt zu #${v}`:`Umbenannt in #${v}`);
    }catch(e){toast(friendly(e))}finally{setBusy(false)}
  },
  async delTag(t){
    const hits=S.EX.filter(e=>e.tags.includes(t));
    if(!confirm(`Tag #${t} aus ${hits.length} Übung(en) entfernen?`))return;
    if(!S.online)return toast('Nur Ansicht — Server nicht erreichbar');
    setBusy(true);
    try{
      for(const e of hits){
        const tags=e.tags.filter(x=>x!==t);
        const {error}=await sb.from('exercises').update({tags}).eq('id',e.id);
        if(error)throw error; e.tags=tags;
      }
      S.ftag=S.ftag.filter(x=>x!==t);render();toast(`#${t} gelöscht`);
    }catch(e){toast(friendly(e))}finally{setBusy(false)}
  },

  /* --- Import und Export --- */
  async importCsv(inp){
    const file=inp.files&&inp.files[0]; if(!file)return;
    const box=document.getElementById('imres');
    box.innerHTML=`<div class="card" style="margin-top:14px;font-size:14px;color:var(--ink-2)">Datei wird gelesen…</div>`;
    const text=await file.text();
    const {rows,errs}=parseCsv(text);
    if(!rows.length){
      box.innerHTML=`<div class="err" style="margin-top:14px">Nichts zu importieren.<br>${errs.map(esc).join('<br>')}</div>`;
      return;
    }
    box.innerHTML=`<div class="card" style="margin-top:14px">
      <div style="font-size:15px;font-weight:650">${rows.length} Übungen gefunden</div>
      <div style="font-size:13px;color:var(--ink-2);margin-top:6px">
        ${TORDER.map(t=>`${rows.filter(r=>r.type===t).length}× ${TYPE[t].label}`).join(' · ')}</div>
      ${errs.length?`<div class="err" style="margin-top:12px">${errs.slice(0,12).map(esc).join('<br>')}${errs.length>12?`<br>… und ${errs.length-12} weitere`:''}</div>`:''}
      <button class="btn" onclick="A.runImport()">${rows.length} Übungen anlegen</button>
      <button class="btn gray" onclick="A.closeSheet()">Abbrechen</button></div>`;
    S._imp=rows;
  },
  async runImport(){
    const rows=S._imp||[]; if(!rows.length)return;
    if(!S.online)return toast('Nur Ansicht — Server nicht erreichbar');
    const box=document.getElementById('imres');
    setBusy(true);
    let done=0, failed=[];
    try{
      const counters={};
      for(const t of TORDER){
        const {data}=await sb.from('exercises').select('code').eq('type',t).order('code',{ascending:false}).limit(1);
        counters[t]=data&&data.length?+data[0].code.slice(1):0;
      }
      const payload=rows.map(r=>({
        id:uid('ex'), code:TYPE[r.type].L+String(++counters[r.type]).padStart(4,'0'),
        type:r.type, name:r.name, equipment:r.eq, muscle_groups:r.mg,
        sets:r.sets, tags:r.tags, notes:r.notes
      }));
      for(let i=0;i<payload.length;i+=50){
        const chunk=payload.slice(i,i+50);
        const {error}=await sb.from('exercises').insert(chunk);
        if(error){ failed.push(friendly(error)); } else { done+=chunk.length; }
        box.innerHTML=`<div class="card" style="margin-top:14px;font-size:14px">${done} von ${payload.length} angelegt…</div>`;
      }
      await loadAll({silent:true});
      box.innerHTML=`<div class="card" style="margin-top:14px">
        <div style="font-size:15px;font-weight:650">${done} Übungen importiert</div>
        ${failed.length?`<div class="err" style="margin-top:10px">${failed.map(esc).join('<br>')}</div>`:''}
        <button class="btn" onclick="A.closeSheet();A.setTab('ueb')">Zu den Übungen</button></div>`;
      S._imp=null;
    }catch(e){
      box.innerHTML=`<div class="err" style="margin-top:14px">${esc(friendly(e))}</div>`;
    }finally{ setBusy(false); }
  },
  exportCsv(){
    const head='code;typ;name;geraet;muskelgruppen;saetze;wiederholungen;gewicht_kg;dauer_min;level;haltezeit_s;je_seite;tags;notizen';
    const q=v=>{const t=String(v??'');return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
    const lines=[...S.EX].sort((a,b)=>CMP.compare(a.code,b.code)).map(e=>{
      let sa='',re='',we='',du='',lv='',ht='',js='';
      if(e.type==='kraft'&&Array.isArray(e.sets)){
        sa=e.sets.length;
        const rs=[...new Set(e.sets.map(x=>x.r))], ws=[...new Set(e.sets.map(x=>x.w))];
        re=rs.length===1?rs[0]:e.sets.map(x=>x.r).join('|');
        we=ws.length===1?ws[0]:e.sets.map(x=>x.w).join('|');
      } else if(e.type==='cardio'){ du=e.sets.minutes??''; lv=e.sets.level??''; }
      else { sa=e.sets.sets??''; ht=e.sets.sec??''; js=e.sets.side?'ja':'nein'; }
      return [e.code,e.type,e.name,e.eq,e.mg.join('|'),sa,re,we,du,lv,ht,js,e.tags.join('|'),e.notes].map(q).join(';');
    });
    download(`uebungen-${key(new Date())}.csv`,'\uFEFF'+head+'\n'+lines.join('\n'),'text/csv;charset=utf-8');
    toast(`${S.EX.length} Übungen exportiert`);
  },
  exportJson(){
    download(`fitnessplanner-backup-${key(new Date())}.json`,
      JSON.stringify({exportedAt:new Date().toISOString(),exercises:S.EX,workouts:S.PLANS,calendar:S.CAL},null,2),
      'application/json');
    toast('Backup erstellt');
  },

  /* --- Konto --- */
  async login(){
    const btn=document.getElementById('lg');
    const email=document.getElementById('mail').value.trim();
    const password=document.getElementById('pw').value;
    S.loginMail=email;
    if(!email||!password)return renderLogin('Bitte E-Mail und Passwort eingeben.');
    btn.disabled=true;btn.textContent='Anmelden…';
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){renderLogin(friendly(error));return}
    S.user=data.user;
    await loadAll();
    $root().innerHTML=shell();
    render();
  },
  async logout(){
    if(!confirm('Abmelden? Der lokale Zwischenspeicher wird geleert.'))return;
    await sb.auth.signOut();
    await cacheClear();
    S.user=null;S.EX=[];S.PLANS=[];S.CAL={shared:{},private:{}};S.stack=[];S.tab='heute';S.view=null;
    render();
  },
  async retry(){
    await loadAll();
    render();
    toast(S.online?'Daten aktualisiert':'Server weiterhin nicht erreichbar');
  }
};
window.A=A;

/* ============================================================
   Zurück-Taste des Geräts
   ============================================================ */
function deviceBack(){
  if(S.sheet){closeSheet();return true}
  if(S.stack.length){A.back();return true}
  if(S.tab!=='heute'){A.setTab('heute');return true}
  return false;
}
window.addEventListener('popstate',()=>{ if(deviceBack())pushHist(); });
try{history.replaceState({app:1},'');history.pushState({app:1},'')}catch(e){}

/* ============================================================
   Start
   ============================================================ */
window.addEventListener('online', ()=>{ if(S.user) A.retry() });
window.addEventListener('offline',()=>{ S.online=false; renderBanner() });

(async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){
      S.user=data.session.user;
      const snap=await cacheGet('snapshot');
      if(snap){S.EX=snap.EX;S.PLANS=snap.PLANS;S.CAL=snap.CAL;S.fromCache=true;S.cacheAt=snap.at;
        S.ready=true;$root().innerHTML=shell();render()}
      await loadAll();
    }
  }catch(e){ S.online=false; S.loadErr=friendly(e); }
  S.ready=true;
  if(S.user&&!document.getElementById('screen')) $root().innerHTML=shell();
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
